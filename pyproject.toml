[project]
name = "pheno-comparisons"
version = "0.1.0"
description = "HP-HP / HP-MP / HP-ZP phenotype similarity tables (Exomiser's cross-species tables) built from the Monarch KG with koza"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
dependencies = [
    "koza>=2.6.2",
    "duckdb>=1.1",
    "pyyaml>=6",
]

[project.scripts]
pheno-comparisons = "pheno_comparisons.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pheno_comparisons"]

[tool.uv.sources]
# koza's annotation-information-content / pairwise-similarity operations are on
# main (monarch-initiative/koza#256) but not yet released; switch to the release.
koza = { git = "https://github.com/monarch-initiative/koza.git", branch = "main" }

[tool.pytest.ini_options]
testpaths = ["tests"]
